name: build a1800_codec
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04      # glibc 2.35, runs on Steam Deck
            name: a1800_codec-linux-x86_64
          - os: macos-14
            name: a1800_codec-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release && cargo build --release
        working-directory: a1800
      - run: cp a1800/target/release/a1800_codec ${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        with: { name: "${{ matrix.name }}", path: "${{ matrix.name }}" }
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: "${{ matrix.name }}" }
